services:
  mysql:
    image: mysql:8.4
    container_name: enterprise-im-mysql
    environment:
      MYSQL_DATABASE: enterprise_im
      MYSQL_USER: im
      MYSQL_PASSWORD: im123456
      MYSQL_ROOT_PASSWORD: root123456
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4
    container_name: enterprise-im-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: