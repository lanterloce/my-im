server:
  port: 8080
spring:
  application:
    name: enterprise-im-server
  datasource:
    url: jdbc:mysql://localhost:3307/enterprise_im?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: im
    password: im123456
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-for-development-only-please-use-a-long-random-secret}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
    issuer: enterprise-im-server
